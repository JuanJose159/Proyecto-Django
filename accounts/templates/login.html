{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Gestor de Cursos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4 md:p-6">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white p-8 md:p-10">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl overflow-hidden shadow-lg shadow-purple-400/40 mb-4">
                <img src="{% static 'img/logo.jpg' %}" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Iniciar sesión</h1>
            <p class="text-sm text-slate-500 mt-2">Accede a tu cuenta del Gestor de Cursos</p>
        </div>

        {% if form.errors %}
        <div class="mb-5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form action="{% url 'login' %}" method="post" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre de usuario</label>
                <input type="text" name="username" id="username" placeholder="Nombre de usuario" required autofocus
                       value="{{ form.username.value|default:'' }}"
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition">
            </div>

            <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 rounded-lg shadow-md transition">
                Ingresar
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-200 text-center text-xs text-slate-500">
            ¿Aún no tienes cuenta?
            <a href="{% url 'registro' %}" class="text-indigo-600 hover:text-indigo-800 font-medium transition">Regístrate</a>
            <span class="mx-1">·</span>
            <a href="{% url 'cursos' %}" class="text-indigo-600 hover:text-indigo-800 font-medium transition">Ver cursos</a>
        </div>
    </main>

</body>
</html>
